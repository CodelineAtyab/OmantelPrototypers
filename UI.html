<!DOCTYPE html>
<html>
  <head>
    <title>LiteDesk</title>  
  </head>
  <body>
    <h1>Anonymous Feedbacks are now Possible!!!</h1> 
    <h2>Be Honest and Provide your Feedback ...</h2>
    <p>
      Following are all the feedbacks given by the entire team:
    </p>
    <ol id="lof"></ol>
  </body>
  <script>
    function addListItem(feedbackContent) {
      let newLi = document.createElement("li");
      newLi.innerHTML = feedbackContent;

      let olObj = document.getElementById("lof");
      olObj.appendChild(newLi);
    }

    async function sendGetFeedbackRequest() {
      const res = await fetch(`${window.location.href}feedbacks`, {method: "GET"});
      const resObj = await res.json();
      
      // Process each USER as the username is the key coming from Python FastAPI
      Object.keys(resObj).forEach(
        (username) => {
          console.log(username);
          resObj[username].forEach((feedbackItem) => {
            addListItem(feedbackItem);
          })
        }
      )
    }
    sendGetFeedbackRequest();
  </script>
</html>
